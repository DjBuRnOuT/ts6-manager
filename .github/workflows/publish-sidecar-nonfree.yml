name: Publish sidecar (Intel non-free VAAPI)

# Fork-only image: the media sidecar built with INTEL_VAAPI_DRIVER=nonfree, so
# Intel GPUs that need intel-media-va-driver-non-free can decode AV1 on the GPU
# (see "AV1 decoding" in docs/public/video-streaming.md). It is published as its
# own package, ghcr.io/<owner>/ts6-manager/sidecar-nonfree, and never touches
# the backend/frontend/sidecar/all-in-one images from publish-images.yml.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.sidecar
      - packages/sidecar/**
      - version.txt
      - .github/workflows/publish-sidecar-nonfree.yml
  # Manual rebuild, e.g. to pick up Debian security updates for ffmpeg/drivers.
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build (defaults to the selected branch)
        required: false
        type: string

concurrency:
  group: sidecar-nonfree-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build sidecar-nonfree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image tags
        id: tags
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GHCR repository names must be lowercase.
          IMAGE="ghcr.io/${OWNER,,}/ts6-manager/sidecar-nonfree"
          FULL_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${FULL_SHA:0:7}"
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version.txt must hold X.Y.Z, got: $VERSION" >&2
            exit 1
          fi
          PUSH_HUB=0
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            PUSH_HUB=1
          else
            echo "::notice::DOCKERHUB_USERNAME/TOKEN unset; publishing GHCR only"
          fi
          {
            echo "image=${IMAGE}"
            echo "git_sha=${FULL_SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "version=${VERSION}"
            echo "push_hub=${PUSH_HUB}"
            echo "list<<EOF"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.tags.outputs.image }}
          tags: type=raw,value=${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.tags.outputs.git_sha }}
            org.opencontainers.image.description=ts6-manager media sidecar with Intel's non-free VAAPI driver

      # Build into the local daemon first so the driver check below runs before
      # anything is pushed. amd64 only: the non-free driver is amd64-only, and
      # the upstream sidecar image is single-arch too. No BuildKit cache, and
      # pull fresh bases, so apt packages are never stale (as in publish-images.yml).
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sidecar
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.tags.outputs.git_sha }}
            INTEL_VAAPI_DRIVER=nonfree
          pull: true

      - name: Verify the non-free Intel driver is installed
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          set -euo pipefail
          REF="${IMAGE}:sha-${SHORT_SHA}"
          # Status "ii" means installed; the free package can appear as "un"
          # (known to dpkg, not installed), so -W alone does not tell them apart.
          status() {
            docker run --rm "$REF" dpkg-query -W -f='${db:Status-Abbrev}' "$1" 2>/dev/null | tr -d ' ' || true
          }
          if [ "$(status intel-media-va-driver-non-free)" != "ii" ]; then
            echo "intel-media-va-driver-non-free is not installed" >&2
            exit 1
          fi
          if [ "$(status intel-media-va-driver)" = "ii" ]; then
            echo "The free intel-media-va-driver is installed too" >&2
            exit 1
          fi
          docker run --rm "$REF" dpkg-query -W -f='${Package} ${Version}\n' intel-media-va-driver-non-free
          docker run --rm "$REF" ls /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so

      - name: Push to GHCR
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: docker push --all-tags "$IMAGE"

      # Optional mirror to <DOCKERHUB_USERNAME>/ts6-manager-sidecar-nonfree.
      # A Hub failure must not fail the GHCR publication.
      - name: Mirror to Docker Hub
        if: steps.tags.outputs.push_hub == '1'
        continue-on-error: true
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          VERSION: ${{ steps.tags.outputs.version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          HUB_IMAGE="${DOCKERHUB_USERNAME,,}/ts6-manager-sidecar-nonfree"
          for SUFFIX in "sha-${SHORT_SHA}" "${VERSION}" latest; do
            echo "Mirroring ${IMAGE}:${SUFFIX} → ${HUB_IMAGE}:${SUFFIX}"
            docker buildx imagetools create --tag "${HUB_IMAGE}:${SUFFIX}" "${IMAGE}:${SUFFIX}"
          done

      - name: Make the GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ENCODED="$(printf '%s' ts6-manager/sidecar-nonfree | jq -sRr @uri)"
          if gh api --method PUT "/user/packages/container/${ENCODED}/visibility" -f visibility=public 2>/dev/null \
            || gh api --method PUT "/orgs/${OWNER}/packages/container/${ENCODED}/visibility" -f visibility=public 2>/dev/null; then
            echo "Package is public"
          else
            echo "::warning::Could not set ts6-manager/sidecar-nonfree public. Set it under Packages → Package settings."
          fi
